name: Bug report
description: Report reproducible incorrect display behavior
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include serial numbers, account details, or a full system profile.
  - type: input
    id: version
    attributes:
      label: LumaDeck version
      placeholder: "0.1.10"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 27.x"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Pro, Apple M-series"
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Display and connection
      placeholder: "Monitor model; USB-C / HDMI / DisplayPort / dock"
    validations:
      required: true
  - type: textarea
    id: arrangement
    attributes:
      label: Display arrangement
      description: Describe which display is primary and how the displays are positioned.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open LumaDeck…
        2. Change…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal or device-identifying information before uploading.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I can still access at least one visible display.
          required: true
