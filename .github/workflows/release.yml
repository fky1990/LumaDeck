name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches bundle version
        shell: zsh {0}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match bundle version v$version" >&2
            exit 1
          fi

      - name: Build release package
        run: ./scripts/package-release.sh release

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            outputs/LumaDeck-macOS-*.zip \
            outputs/LumaDeck-macOS-*.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "LumaDeck ${GITHUB_REF_NAME}"
